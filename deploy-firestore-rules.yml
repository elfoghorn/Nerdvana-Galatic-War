# Optional. Pushes firestore.rules and firestore.indexes.json to Firebase when you change them.
# It does nothing until you add two things in the repository's Settings > Secrets and variables > Actions:
#   Variables tab: FIREBASE_PROJECT_ID   (your project ID, for example galactic-war)
#   Secrets tab:   FIREBASE_SERVICE_ACCOUNT   (the JSON key of a service account, see SETUP.md)
# Without them, update the rules by pasting them into the Firebase console instead.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths: ["firestore.rules", "firestore.indexes.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check this workflow is set up
        id: check
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PROJECT" ]; then
            echo "::notice::Skipping: FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID is not set. Paste the rules into the Firebase console instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Refuse to deploy an empty GM list
        if: steps.check.outputs.ready == 'true'
        run: |
          if grep -q "PASTE-GM-UID-HERE" firestore.rules; then
            echo "::error::firestore.rules still contains PASTE-GM-UID-HERE. Add your GM user IDs first (SETUP.md step 6)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Deploy rules and indexes
        if: steps.check.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
